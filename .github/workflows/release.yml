name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Compute version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Semver: bump the PATCH of the latest published release on every push
          # to main. To cut a minor/major release, publish that tag manually and
          # the next push continues patching from it (e.g. v1.2.0 -> v1.2.1).
          LATEST="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          if [ -z "$LATEST" ]; then LATEST="v0.0.0"; fi
          CLEAN="${LATEST#v}"
          MAJOR="$(echo "$CLEAN" | cut -d. -f1)"
          MINOR="$(echo "$CLEAN" | cut -d. -f2)"
          PATCH="$(echo "$CLEAN" | cut -d. -f3)"
          MAJOR="${MAJOR:-0}"; MINOR="${MINOR:-0}"
          # Strip any pre-release/build suffix from patch (e.g. 1-rc1 -> 1).
          PATCH="${PATCH%%[!0-9]*}"; PATCH="${PATCH:-0}"
          VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (previous: $LATEST)"

      - name: Embed version
        run: |
          cat > Sources/KillSwitch/Version.swift <<EOF
          import Foundation

          // Generated by .github/workflows/release.yml at release time. Do not edit.
          enum AppVersion {
              static let current = "${{ steps.version.outputs.version }}"

              static var isDev: Bool { current == "dev" }
          }
          EOF

      - name: Build (release)
        run: swift build -c release

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp .build/release/KillSwitch dist/KillSwitch
          tar -czf dist/KillSwitch.tar.gz -C .build/release KillSwitch

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(git log -1 --pretty=%B)"
          gh release create "${{ steps.version.outputs.version }}" \
            dist/KillSwitch dist/KillSwitch.tar.gz \
            --title "${{ steps.version.outputs.version }}" \
            --notes "$NOTES"
