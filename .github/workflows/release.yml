name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Show Swift version
        run: swift --version

      - name: Compute version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Semver: bump the PATCH of the latest published release on every push
          # to main. To cut a minor/major release, publish that tag manually and
          # the next push continues patching from it (e.g. v1.2.0 -> v1.2.1).
          LATEST="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          if [ -z "$LATEST" ]; then LATEST="v0.0.0"; fi
          CLEAN="${LATEST#v}"
          MAJOR="$(echo "$CLEAN" | cut -d. -f1)"
          MINOR="$(echo "$CLEAN" | cut -d. -f2)"
          PATCH="$(echo "$CLEAN" | cut -d. -f3)"
          MAJOR="${MAJOR:-0}"; MINOR="${MINOR:-0}"
          # Strip any pre-release/build suffix from patch (e.g. 1-rc1 -> 1).
          PATCH="${PATCH%%[!0-9]*}"; PATCH="${PATCH:-0}"
          VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (previous: $LATEST)"

      - name: Embed version
        run: |
          cat > Sources/KillSwitch/Version.swift <<EOF
          import Foundation

          // Generated by .github/workflows/release.yml at release time. Do not edit.
          enum AppVersion {
              static let current = Bundle.main.object(forInfoDictionaryKey: "KillSwitchVersion") as? String ?? "${{ steps.version.outputs.version }}"

              static var isDev: Bool { current == "dev" }
          }
          EOF

      - name: Package universal app and DMG
        env:
          KILLSWITCH_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/package-macos.sh --universal-build

      - name: Verify macOS package
        run: bash scripts/check-macos-package.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(git log -1 --pretty=%B)"
          gh release create "${{ steps.version.outputs.version }}" \
            dist/KillSwitch dist/KillSwitch.tar.gz dist/KillSwitch.sha256 \
            dist/KillSwitch.dmg dist/KillSwitch.dmg.sha256 \
            --title "${{ steps.version.outputs.version }}" \
            --notes "$NOTES"
