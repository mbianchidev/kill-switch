name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Compute version
        id: version
        run: |
          # CalVer + monotonic run number: vYYYY.MM.DD.<run_number>.
          # Sortable and strictly increasing across pushes to main.
          VERSION="v$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Embed version
        run: |
          cat > Sources/KillSwitch/Version.swift <<EOF
          import Foundation

          // Generated by .github/workflows/release.yml at release time. Do not edit.
          enum AppVersion {
              static let current = "${{ steps.version.outputs.version }}"

              static var isDev: Bool { current == "dev" }
          }
          EOF

      - name: Build (release)
        run: swift build -c release

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp .build/release/KillSwitch dist/KillSwitch
          tar -czf dist/KillSwitch.tar.gz -C .build/release KillSwitch

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(git log -1 --pretty=%B)"
          gh release create "${{ steps.version.outputs.version }}" \
            dist/KillSwitch dist/KillSwitch.tar.gz \
            --title "${{ steps.version.outputs.version }}" \
            --notes "$NOTES"
