name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Show Swift version
        run: swift --version

      - name: Dev cleanup core checks
        run: swift run DevCleanupCoreChecks

      - name: Disk cleanup core checks
        run: swift run DiskCleanupCoreChecks

      - name: Install path safety checks
        run: swift run InstallCoreChecks

      - name: Test system metric parsers
        run: swift run SystemMetricsChecks

      - name: Test screen time tracking
        run: swift run ScreenTimeCoreChecks

      - name: Package universal app and DMG
        run: bash scripts/package-macos.sh

      - name: Verify macOS package
        run: bash scripts/check-macos-package.sh

      - name: Upload DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KillSwitch-macOS
          path: |
            dist/KillSwitch.dmg
            dist/KillSwitch.dmg.sha256
          if-no-files-found: error
