name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Show Swift version
        run: swift --version

      - name: Dev cleanup core checks
        run: swift run DevCleanupCoreChecks

      - name: Test system metric parsers
        run: swift run SystemMetricsChecks

      - name: Build (release)
        run: swift build -c release --product KillSwitch
